id = "fix-logparse-crash"
title = "修日志统计遇到坏行崩溃"
category = "fix"
prompt = """
`python3 stats.py app.log` 碰到空行和格式不对的行就崩溃。
一行正常的日志有日期、时间、级别、消息四部分，用空格隔开，比如 `2026-01-05 10:12:01 INFO 服务启动`；级别只有 DEBUG、INFO、WARNING、ERROR 四种。不符合这个格式的都算格式不对。
约定：
- 跳过空行和格式不对的行，它们不计入任何级别；
- 其余的行照旧统计每个级别的条数，原来的输出格式不变；
- 最后多打印一行 `bad lines: N`，N 是跳过的行数，空行也算在内。
"""
