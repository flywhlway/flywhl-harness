# 离线测试：脚本化模型驱动，结果确定、零成本、不需要任何密钥。
# 真实模型测试（tests/live，标记 live）要花钱、要密钥，pyproject 的 addopts 默认把它们排除，这里也不跑；
# 本地运行方式与分类结果见 tests/live/README.md。
name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "design-system/**", "**.md"]
  pull_request:
  workflow_dispatch:
  workflow_call:            # 发布流水线复用：标签上再跑一遍全部离线门禁

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15            # 演示脚本等子进程输出时若卡住，别占满默认的 6 小时
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest          # 开发机是 macOS：/etc → /private/etc 这类路径解析差异要覆盖到
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: 安装依赖（按 uv.lock 锁定版本）
        run: uv sync --locked --all-extras   # 含 anthropic SDK，覆盖 Anthropic 协议的离线回归
      - uses: ./.github/actions/bubblewrap
      - name: 离线测试（不含 live）
        run: uv run pytest -q
        env:
          FLYWHL_REQUIRE_SANDBOX: "1"     # 沙箱起不来时失败：否则沙箱用例全部跳过，作业还是绿的
      - name: 审计不变量
        run: uv run pytest -q docs/quality-audit/tests
        env:
          FLYWHL_REQUIRE_SANDBOX: "1"
      - name: 演示：kill -9 后另一个进程接管并完成
        run: uv run python examples/11_kill9_cli_recover.py

  # 装 wheel、不写配置，验证凭证读不到、工作区外写不了、网络默认受控，hook 与 MCP 服务器同样如此；没有沙箱时拒绝执行
  sandbox-acceptance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: ./.github/actions/bubblewrap
      - name: 打包并装进干净的虚拟环境
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/fresh"
          uv pip install --python "$RUNNER_TEMP/fresh/bin/python" dist/*.whl
      - name: 验收
        run: '"$RUNNER_TEMP/fresh/bin/python" scripts/sandbox_acceptance.py --internet --json sandbox-acceptance.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-acceptance-${{ matrix.os }}
          path: sandbox-acceptance.json

  # 覆盖率棘轮和依赖漏洞：覆盖率比基线低超过容差时失败，依赖漏洞只出报告。结果写进作业摘要并作为产物上传
  coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装依赖（按 uv.lock 锁定版本）
        run: uv sync --locked --all-extras
      - uses: ./.github/actions/bubblewrap
      - name: 离线测试并收集覆盖率（scripts/safe_pytest.py 两段收集后合并）
        run: FLYWHL_COVERAGE=1 uv run pytest -q
      - name: 覆盖率报告
        if: always()
        run: |
          uv run coverage report --sort=cover > coverage.txt
          uv run coverage xml -o coverage.xml
          uv run coverage json -q -o coverage.json
          { echo "## 覆盖率"; uv run coverage report --sort=cover --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      - name: 覆盖率棘轮（基线见 docs/quality-audit/coverage-baseline.json）
        run: |
          set -o pipefail
          uv run python scripts/coverage_ratchet.py coverage.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 依赖漏洞扫描（运行时依赖：核心 + anthropic 扩展）
        if: always()
        continue-on-error: true   # 只报告；发现漏洞时 pip-audit 退出码非 0，作业仍算通过
        run: |
          uv export --frozen --no-dev --extra anthropic --no-emit-project --format requirements-txt -o requirements-runtime.txt
          rc=0
          # 没有漏洞时 pip-audit 不写 -o 指定的文件，只在 stderr 打一行结论，所以两路输出都收进文件
          uvx -q pip-audit@2.10.1 -r requirements-runtime.txt --disable-pip --progress-spinner off -f markdown > pip-audit.md 2>&1 || rc=$?
          { echo "## 依赖漏洞（pip-audit）"; cat pip-audit.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-audit
          path: |
            coverage.txt
            coverage.xml
            coverage.json
            pip-audit.md
