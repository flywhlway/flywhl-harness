# 把 docs/ 构建为静态站点并发布到 GitHub Pages。
# 仓库 Settings → Pages → Source 选择 “GitHub Actions”。
name: deploy-docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/deploy-docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # lastUpdated 需要完整 git 历史
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/   # 项目页部署在子路径下
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
