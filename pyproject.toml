[project]
name = "flywhl-harness"
dynamic = ["version"]
description = "A hand-written Agent Harness in Python: agent loop, tools, context compaction, crash recovery, permissions, a default-on OS sandbox, replay and a web console."
readme = "README.en.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "flywhl" }]
keywords = ["agent", "harness", "llm", "runtime", "tool-calling", "sandbox", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "httpx>=0.27",      # 模型 provider 的流式 HTTP
  "fastapi>=0.110",   # Web UI 与 REST/SSE 接口（核心包不依赖它）
  "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]   # Anthropic provider 使用官方 SDK
dev = ["pytest>=8", "pytest-asyncio>=0.23", "coverage>=7.10"]

[project.urls]
Homepage = "https://github.com/flywhlway/flywhl-harness"
Documentation = "https://flywhlway.github.io/flywhl-harness/en/"
Source = "https://github.com/flywhlway/flywhl-harness"
Issues = "https://github.com/flywhlway/flywhl-harness/issues"
Changelog = "https://github.com/flywhlway/flywhl-harness/blob/main/CHANGELOG.md"

[project.scripts]
flywhl = "flywhl_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/flywhl_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flywhl_harness"]

# sdist 用白名单：文档站、试验场、编辑器配置都不进包。
# 根目录 conftest.py 和 scripts/safe_pytest.py 是测试的防线（系统沙箱、HOME 隔离、执行绊线），tests/ 进包，它们就必须跟着进
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/conftest.py",
  "/scripts/safe_pytest.py",
  "/README*.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 真实模型测试默认不跑（要花钱、要密钥、结果有随机性）：pytest -m live tests/live 显式运行
addopts = "-m 'not live'"
markers = [
    "live: 调用真实模型的端到端测试（需要密钥，见 tests/live/README.md）",
    "os_sandbox: 测试 bash 工具的系统沙箱档位；系统沙箱不能嵌套，scripts/safe_pytest.py 在外层沙箱之外单独运行它们",
]

# 覆盖率不设绝对阈值，棘轮见 scripts/coverage_ratchet.py：FLYWHL_COVERAGE=1 pytest 由 scripts/safe_pytest.py 两段收集后合并，再 coverage report
[tool.coverage.run]
source = ["flywhl_harness"]
branch = true
parallel = true            # 两段各写一份数据
# 不测子进程（patch = subprocess）：第二段里系统沙箱中的 Python 子进程写不了数据文件会报错，实测也不增加覆盖行数
relative_files = true

[tool.coverage.report]
skip_empty = true

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "coverage>=7.10"]
