<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>flywhl harness · Agent 控制台</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg"><!-- 飞轮标识：图形与文档站 logo 相同，配色取控制台品牌蓝 -->
  <link rel="stylesheet" href="/static/style.css">
  <!-- 首帧就用正确的主题，避免明暗闪烁 -->
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("flywhl-theme") || "system"; } catch {}</script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主内容</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="sidebar-head">
        <a class="brand" href="#/" aria-label="flywhl harness 首页">
          <!-- 飞轮标识：图形与文档站 logo 相同；外圈与轮毂实色、辐条半透明，颜色取 --logo（随明暗主题切换） -->
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <path class="spokes" d="M16 4v24M4 16h24M7.5 7.5l17 17M24.5 7.5l-17 17" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="3"/>
            <circle cx="16" cy="16" r="3.4" fill="currentColor"/>
          </svg>
          <span class="brand-text">
            <span class="brand-name">flywhl <span class="brand-product">harness</span></span>
            <span class="brand-sub">Agent 控制台</span>
          </span>
        </a>
      </div>

      <div class="sidebar-actions">
        <button class="btn primary block" id="new-session" type="button"></button>
        <button class="search-trigger" id="open-palette" type="button" aria-keyshortcuts="Meta+K Control+K"></button>
      </div>

      <nav class="nav" id="nav" aria-label="页面"></nav>

      <div class="sidebar-section">
        <div class="section-label" id="recent-label">最近会话</div>
        <ul class="session-list" id="session-list" aria-labelledby="recent-label"></ul>
      </div>

      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <!-- 全局浮层：提示、对话框、命令面板；屏幕阅读器的状态播报区 -->
  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
  <div id="overlay-root"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
